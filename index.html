<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}.wrap{padding-top:calc(8px + env(safe-area-inset-top,0px))!important}</style>
<title>E3 輪班手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="輪班手帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 調色原則：月曆大面積只用同一明度的淺色底（每種狀態一組「底色／字色／重點色」），
   飽和的橘色只留給按鈕與重點；假日用紅色小標籤，發薪日用彩虹框。 */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EBEFF3; --ink:#1A2532; --muted:#66768A; --line:#E1E6EC;
  --e3:#F26A2E; --e3-soft:#FFE6D8; --e3-ink:#FFFFFF; --e1:#3D6FF0; --e2:#13A085;
  --red:#D93A4B; --rose:#C23A86; --gold:#E0A100; --gold-soft:#FFF4D2;
  --ok:#17834A; --ok-soft:#DDF2E5; --warn:#A86600; --warn-soft:#FFF1D6;
  --c-work:#FFE4D4; --c-work-ink:#5A2A12; --c-work-acc:#D9531A;
  --c-ot:#D7EEFA; --c-ot-ink:#0F3F5A; --c-ot-acc:#1C86BF;
  --c-swap:#E7E0FF; --c-swap-ink:#2E1F6B; --c-swap-acc:#6A4AE0; --c-swap-dash:#9B86F2;
  --lv-annual:#FFF1BD; --lvt-annual:#4D3A00; --lva-annual:#A57A00;
  --lv-comp:#D6F2E2; --lvt-comp:#11402A; --lva-comp:#1F8A55;
  --lv-ritual:#E8F0CC; --lvt-ritual:#34400B; --lva-ritual:#6B8A12;
  --lv-sick:#F5DDF0; --lvt-sick:#4A1640; --lva-sick:#A3368C;
  --lv-personal:#E3E8EF; --lvt-personal:#26313F; --lva-personal:#56657A;
  --lv-family:#F2E5CF; --lvt-family:#43321A; --lva-family:#94692A;
  --lv-marriage:#FFDCE5; --lvt-marriage:#5A1528; --lva-marriage:#C23A5E;
  --lv-funeral:#E4E1EC; --lvt-funeral:#2C2840; --lva-funeral:#5E5880;
  --typh:rgba(19,160,133,.16);
  --rainbow:linear-gradient(135deg,#FF7A8A,#FFC15E,#5FD69A,#55B8F0,#A88BFF);
  --shadow:0 10px 30px rgba(26,37,50,.14);
  --f-num:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#171E27; --sunk:#121820; --ink:#E6ECF2; --muted:#93A1B1; --line:#26303C;
  --e3:#FF7D45; --e3-soft:#3B2418; --e3-ink:#1A0E07; --e1:#7B9CFF; --e2:#34C7A5;
  --red:#FF6B78; --rose:#EC6AB2; --gold:#FFC53A; --gold-soft:#36301A;
  --ok:#47C985; --ok-soft:#15301F; --warn:#FFB54D; --warn-soft:#382A14;
  --c-work:#3B2418; --c-work-ink:#FFD9C4; --c-work-acc:#FF8A50;
  --c-ot:#12324A; --c-ot-ink:#CDEBFA; --c-ot-acc:#5CC0F0;
  --c-swap:#2A2352; --c-swap-ink:#E1D9FF; --c-swap-acc:#A58CFF; --c-swap-dash:#8B74F0;
  --lv-annual:#3A3212; --lvt-annual:#FFEFB0; --lva-annual:#F2C744;
  --lv-comp:#14352A; --lvt-comp:#CFF3DF; --lva-comp:#4CCB8A;
  --lv-ritual:#2C3414; --lvt-ritual:#E6F0C2; --lva-ritual:#A8C84A;
  --lv-sick:#3A1C36; --lvt-sick:#F7D3EF; --lva-sick:#E070C8;
  --lv-personal:#232C38; --lvt-personal:#D5DEE8; --lva-personal:#9AAABD;
  --lv-family:#3A2E1C; --lvt-family:#F2E2C6; --lva-family:#D8A75A;
  --lv-marriage:#3F1B27; --lvt-marriage:#FFD3DE; --lva-marriage:#FF7A9E;
  --lv-funeral:#29263A; --lvt-funeral:#DEDAEA; --lva-funeral:#A59EC8;
  --typh:rgba(52,199,165,.16);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --sunk:#121820; --ink:#E6ECF2; --muted:#93A1B1; --line:#26303C;
  --e3:#FF7D45; --e3-soft:#3B2418; --e3-ink:#1A0E07; --e1:#7B9CFF; --e2:#34C7A5;
  --red:#FF6B78; --rose:#EC6AB2; --gold:#FFC53A; --gold-soft:#36301A;
  --ok:#47C985; --ok-soft:#15301F; --warn:#FFB54D; --warn-soft:#382A14;
  --c-work:#3B2418; --c-work-ink:#FFD9C4; --c-work-acc:#FF8A50;
  --c-ot:#12324A; --c-ot-ink:#CDEBFA; --c-ot-acc:#5CC0F0;
  --c-swap:#2A2352; --c-swap-ink:#E1D9FF; --c-swap-acc:#A58CFF; --c-swap-dash:#8B74F0;
  --lv-annual:#3A3212; --lvt-annual:#FFEFB0; --lva-annual:#F2C744;
  --lv-comp:#14352A; --lvt-comp:#CFF3DF; --lva-comp:#4CCB8A;
  --lv-ritual:#2C3414; --lvt-ritual:#E6F0C2; --lva-ritual:#A8C84A;
  --lv-sick:#3A1C36; --lvt-sick:#F7D3EF; --lva-sick:#E070C8;
  --lv-personal:#232C38; --lvt-personal:#D5DEE8; --lva-personal:#9AAABD;
  --lv-family:#3A2E1C; --lvt-family:#F2E2C6; --lva-family:#D8A75A;
  --lv-marriage:#3F1B27; --lvt-marriage:#FFD3DE; --lva-marriage:#FF7A9E;
  --lv-funeral:#29263A; --lvt-funeral:#DEDAEA; --lva-funeral:#A59EC8;
  --typh:rgba(52,199,165,.16);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--e1);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(150px + env(safe-area-inset-bottom,0px))}

/* 頂部 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:10px}
.mo{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.mo b{font:800 34px/1 var(--f-num);letter-spacing:-.02em}
.mo span{color:var(--muted);font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.pillbtn{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;flex:none}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-block:2px 10px}
.legend{display:flex;gap:8px 10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 月曆 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--muted);padding-bottom:2px}
.wd.sun,.wd.sat{color:var(--red)}
.cell{--fill:var(--surface);--tx:var(--ink);--acc:var(--muted);position:relative;min-height:74px;border-radius:12px;border:1.5px solid var(--line);background:var(--fill);color:var(--tx);padding:5px 5px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell.out{visibility:hidden}
.cell .d{font:700 18px/1 var(--f-num)}
.cell .st{font-size:11px;font-weight:900;letter-spacing:.02em;color:var(--acc);white-space:nowrap;overflow:hidden}
.cell.red .d{color:var(--red)}
.cell.today{outline:2.5px solid var(--ink);outline-offset:1.5px}
.cell .marks{margin-top:auto;display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.mk{font-size:9px;font-weight:900;line-height:1;padding:2px 3px;border-radius:4px;background:var(--surface);color:var(--acc)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.teams{display:flex;gap:2px;margin-top:auto}
.teams span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.teams .on1{background:var(--e1)}.teams .on2{background:var(--e2)}.teams .on3{background:var(--e3)}
/* 狀態：底色／字色／重點色一組 */
.cell.work{--fill:var(--c-work);--tx:var(--c-work-ink);--acc:var(--c-work-acc);border-color:transparent}
.cell.ot{--fill:var(--c-ot);--tx:var(--c-ot-ink);--acc:var(--c-ot-acc);border-color:transparent}
.cell.swapW{--fill:var(--c-swap);--tx:var(--c-swap-ink);--acc:var(--c-swap-acc);border-color:transparent}
.cell.swapO{--acc:var(--c-swap-acc);border:1.5px dashed var(--c-swap-dash)}
.cell.lv{border-color:transparent}
.cell.lv-annual{--fill:var(--lv-annual);--tx:var(--lvt-annual);--acc:var(--lva-annual)}
.cell.lv-comp{--fill:var(--lv-comp);--tx:var(--lvt-comp);--acc:var(--lva-comp)}
.cell.lv-ritual{--fill:var(--lv-ritual);--tx:var(--lvt-ritual);--acc:var(--lva-ritual)}
.cell.lv-sick{--fill:var(--lv-sick);--tx:var(--lvt-sick);--acc:var(--lva-sick)}
.cell.lv-personal{--fill:var(--lv-personal);--tx:var(--lvt-personal);--acc:var(--lva-personal)}
.cell.lv-family{--fill:var(--lv-family);--tx:var(--lvt-family);--acc:var(--lva-family)}
.cell.lv-marriage{--fill:var(--lv-marriage);--tx:var(--lvt-marriage);--acc:var(--lva-marriage)}
.cell.lv-funeral{--fill:var(--lv-funeral);--tx:var(--lvt-funeral);--acc:var(--lva-funeral)}
.cell.lv.work::before,.cell.ot.work::before{content:"";position:absolute;left:8px;right:8px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c-work-acc)}
.cell.holrest{--acc:var(--red)}
.mk.sw{background:var(--c-swap-acc);color:#fff}
.mk.ty{background:var(--e2);color:#fff}
.cell.typh::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(135deg,var(--typh) 0 5px,transparent 5px 11px)}
.hp{display:block;max-width:100%;font-size:10px;font-weight:900;line-height:1.3;padding:1px 3px;border-radius:5px;color:#fff;background:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp.company{background:var(--rose)}
.hp.makeup{background:transparent;color:var(--acc);padding:0;font-weight:700}
.key{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);flex:none}
.lvdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0;border:1px solid var(--line)}
.stat.c-work{background:var(--c-work);border-color:transparent}
.stat.c-pay{background:var(--c-ot);border-color:transparent}
.stat.c-leave{background:var(--lv-annual);border-color:transparent}
.stat.hot{border:2.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--rainbow) border-box}
.tabs button[aria-current="page"] svg{background:var(--c-work);border-radius:10px;padding:2px;width:32px;height:26px}
/* 發薪日：彩虹框 */
.cell.payday{border:2.5px solid transparent;background:linear-gradient(var(--fill),var(--fill)) padding-box,var(--rainbow) border-box;padding:4px 4px 5px}
.mk.pay{background:var(--rainbow);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3)}
@media (prefers-reduced-motion: no-preference){.cell.payday{animation:shine 3.2s ease-in-out infinite}@keyframes shine{50%{filter:saturate(1.25) brightness(1.03)}}}

/* 摘要 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left}
.stat small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.stat b{font:800 24px/1.15 var(--f-num)}
.stat em{font-style:normal;color:var(--muted);font-size:12px}


/* 通用 */
h2{font:900 20px/1.3 var(--f-body);margin:14px 0 8px;text-wrap:balance}
h3{font-size:14px;font-weight:900;margin:16px 0 6px;color:var(--muted);letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.e3{background:var(--e3-soft);color:var(--e3)}
.chip.red{background:transparent;color:var(--red);border:1px solid var(--red)}
.chip.gold{background:var(--gold-soft);color:var(--warn)}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:900;background:var(--sunk)}
.btn.main{background:var(--e3);color:var(--e3-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
input[type=number],input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 10px;font-size:16px;color:var(--ink);min-width:0}
textarea{min-height:96px;resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.flag{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;margin-top:8px}
.okbox{background:var(--ok-soft);color:var(--ok)}
.big{font:800 40px/1 var(--f-num);letter-spacing:-.02em}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
details.card>summary{list-style:none;cursor:pointer;font-weight:900;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--muted)}
details.card[open]>summary::after{content:"－"}
details.card[open]>summary{margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:10px}

/* 底部分頁 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:transparent;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--e3)}
.fab{position:fixed;z-index:24;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:24px;height:24px}

/* 抽屜 */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,14,20,.45)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in{max-width:560px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sh-date{font:800 30px/1.05 var(--f-num)}
.status{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:900;font-size:14px}
.status.w{background:var(--e3);color:var(--e3-ink)}
.status.o{background:var(--sunk);color:var(--muted)}
.who{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.who span{font:700 12px/1 var(--f-num);padding:5px 8px;border-radius:8px;border:1.5px solid var(--line);color:var(--muted)}
.who span.on{color:#fff;border-color:transparent}
.who .t1.on{background:var(--e1)}.who .t2.on{background:var(--e2)}.who .t3.on{background:var(--e3)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font:700 14px var(--f-num)}
.picks button[aria-pressed="true"]{border-color:var(--e3);background:var(--e3-soft);color:var(--e3)}
.photos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}
.addph{border:1.5px dashed var(--line);background:transparent;border-radius:10px;aspect-ratio:1;max-width:100%;font-size:22px;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.viewer img{max-height:90%;border-radius:8px}

/* 小算盤 */
.calc-disp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:right;margin-bottom:10px}
.calc-disp .ex{color:var(--muted);min-height:20px;font:500 14px var(--f-num);word-break:break-all}

<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="打開小算盤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg></button>
<div class="tabs"><nav id="tabs"></nav></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></section>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===== 計算核心（與畫面分離，可獨立測試） ===== */
const Calc = (() => {
  const pad = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const fromDate = dt => ymd(dt.getUTCFullYear(), dt.getUTCMonth() + 1, dt.getUTCDate());
  const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return fromDate(d); };
  const diffDays = (a, b) => Math.round((toDate(a) - toDate(b)) / 864e5);
  const dow = s => toDate(s).getUTCDay();
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const ymOf = s => s.slice(0, 7);
  const ymAdd = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
  const monthDates = ym => { const [y, m] = ym.split('-').map(Number); const out = []; for (let d = 1; d <= dim(y, m); d++) out.push(ymd(y, m, d)); return out; };
  const ceil = x => Math.ceil(x - 1e-9);
  const round = x => Math.round(x + 1e-9);

  /* --- 班表：做四休二，6 天一循環（已驗證：2026/10 班別表、2026/07 出勤表） --- */
  const ANCHOR = { E1: '2026-09-29', E2: '2026-10-01', E3: '2026-10-03' };
  const TEAMS = ['E1', 'E2', 'E3'];
  const SHIFT_HOURS = 10;
  const baseWork = (team, date) => ((diffDays(date, ANCHOR[team]) % 6) + 6) % 6 < 4;

  /* --- 假日 --- 農曆與清明：香港天文台對照表（與台灣同為 UTC+8）
     [正月初一, 端午, 中秋, 清明] */
  const LUNAR = {
    2026: ['2026-02-17', '2026-06-19', '2026-09-25', '2026-04-05'],
    2027: ['2027-02-06', '2027-06-09', '2027-09-15', '2027-04-05'],
    2028: ['2028-01-26', '2028-05-28', '2028-10-03', '2028-04-04'],
    2029: ['2029-02-13', '2029-06-16', '2029-09-22', '2029-04-04'],
    2030: ['2030-02-03', '2030-06-05', '2030-09-12', '2030-04-05'],
    2031: ['2031-01-23', '2031-06-24', '2031-10-01', '2031-04-05'],
    2032: ['2032-02-11', '2032-06-12', '2032-09-19', '2032-04-04'],
    2033: ['2033-01-31', '2033-06-01', '2033-09-08', '2033-04-04'],
    2034: ['2034-02-19', '2034-06-20', '2034-09-27', '2034-04-05'],
    2035: ['2035-02-08', '2035-06-10', '2035-09-16', '2035-04-05'],
    2036: ['2036-01-28', '2036-05-30', '2036-10-04', '2036-04-04'],
    2037: ['2037-02-15', '2037-06-18', '2037-09-24', '2037-04-04']
  };
  const YEARS = Object.keys(LUNAR).map(Number);

  function genYear(y) {
    const L = LUNAR[y]; const list = [];
    const add = (date, name, kind) => list.push({ date, name, kind });
    add(ymd(y, 1, 1), '元旦', 'national');
    const ny = L[0];
    const spring = [addDays(ny, -2), addDays(ny, -1), ny, addDays(ny, 1), addDays(ny, 2)];
    ['小年夜', '除夕', '春節', '春節', '春節'].forEach((n, i) => add(spring[i], n, 'national'));
    add(ymd(y, 2, 28), '和平紀念日', 'national');
    const qm = L[3];
    add(qm === ymd(y, 4, 4) ? ymd(y, 4, 3) : ymd(y, 4, 4), '兒童節', 'national');
    add(qm, '清明節', 'national');
    add(ymd(y, 5, 1), '勞動節', 'national');
    add(L[1], '端午節', 'national');
    add(L[2], '中秋節', 'national');
    add(ymd(y, 9, 28), '教師節', 'national');
    add(ymd(y, 10, 10), '國慶日', 'national');
    add(ymd(y, 10, 25), '光復節', 'national');
    add(ymd(y, 12, 25), '行憲紀念日', 'national');
    add(ymd(y, 3, 29), '青年節', 'company');
    add(ymd(y, 10, 31), '蔣公誕辰', 'company');
    add(ymd(y, 11, 12), '國父誕辰', 'company');
    // 補假（推算）：週六提前到週五、週日延後到週一；春節區段遇週末，往後順延
    const nat = new Set(list.filter(h => h.kind === 'national').map(h => h.date));
    const made = new Set();
    const off = d => { const w = dow(d); return w === 0 || w === 6 || nat.has(d) || made.has(d); };
    let extra = spring.filter(d => [0, 6].includes(dow(d))).length, cur = spring[4];
    while (extra > 0) { cur = addDays(cur, 1); if (!off(cur)) { made.add(cur); add(cur, '春節補假', 'makeup'); extra--; } }
    list.filter(h => h.kind === 'national' && !spring.includes(h.date)).forEach(h => {
      const w = dow(h.date); if (w !== 0 && w !== 6) return;
      const step = w === 6 ? -1 : 1; let c = h.date;
      do { c = addDays(c, step); } while (off(c));
      made.add(c); add(c, h.name + '補假', 'makeup');
    });
    return list;
  }
  let GEN = null;
  const generated = () => {
    if (!GEN) { GEN = {}; YEARS.forEach(y => genYear(y).forEach(h => { (GEN[h.date] = GEN[h.date] || []).push({ name: h.name, kind: h.kind }); })); }
    return GEN;
  };
  // edits: { date: [ {name, kind} ] }，空陣列 = 刪除當天全部
  const holidaysOn = (date, edits) => (edits && edits[date]) ? edits[date] : (generated()[date] || []);
  const holidayList = (year, edits) => {
    const dates = new Set([...Object.keys(generated()), ...Object.keys(edits || {})].filter(d => d.startsWith(year + '-')));
    return [...dates].sort().flatMap(d => holidaysOn(d, edits).map(h => ({ date: d, ...h, edited: !!(edits && edits[d]) })));
  };
  const isRedDay = (date, edits) => holidaysOn(date, edits).some(h => h.kind === 'national' || h.kind === 'company');
  const isBankOff = (date, edits) => { const w = dow(date); return w === 0 || w === 6 || holidaysOn(date, edits).some(h => h.kind === 'national' || h.kind === 'makeup'); };

  /* --- 薪資日：每月 5 日發上個月薪資，遇週末或國定假日往前推到最近的上班日（已驗證） --- */
  function payday(salaryYm, edits) {
    let d = ymAdd(salaryYm, 1) + '-05';
    while (isBankOff(d, edits)) d = addDays(d, -1);
    return d;
  }

  /* --- 調班 --- swap: {id, kind:'self'|'peer', peer, workDate, offDate}
     workDate：原本上班 → 變休假；offDate：原本休假 → 變上班 */
  function swapOn(date, swaps) { return (swaps || []).find(s => s.workDate === date || s.offDate === date) || null; }
  function finalWork(date, swaps, team = 'E3') {
    const b = baseWork(team, date); const s = swapOn(date, swaps);
    return s ? !b : b;
  }
  function swapLabel(date, s) {
    if (!s) return '';
    if (s.kind === 'self') return s.workDate === date ? '自調休' : '自調上';
    return s.workDate === date ? '調休' : '調上';
  }
  function validateSwap(swaps, a, b, ignoreId) {
    if (!a || !b) return '請選兩個日期';
    if (a === b) return '兩個日期不能相同';
    const others = (swaps || []).filter(s => s.id !== ignoreId);
    for (const d of [a, b]) if (others.some(s => s.workDate === d || s.offDate === d)) return `${d.slice(5).replace('-', '/')} 已經有調班紀錄`;
    if (ymOf(a) !== ymOf(b)) return '調班不可跨月，兩天必須在同一個月';
    const wa = baseWork('E3', a), wb = baseWork('E3', b);
    if (wa === wb) return wa ? '兩天原本都是上班日，必須一天上班、一天休假' : '兩天原本都是休假日，必須一天上班、一天休假';
    return null;
  }
  const orderSwap = (a, b) => baseWork('E3', a) ? { workDate: a, offDate: b } : { workDate: b, offDate: a };

  /* --- 假別 --- */
  const LEAVE_TYPES = [
    { key: 'annual', name: '特休', rate: 0, verified: true },
    { key: 'comp', name: '補休', rate: 0, verified: true },
    { key: 'ritual', name: '原住民祭儀假', rate: 0, verified: true },
    { key: 'sick', name: '病假', rate: 0.5, verified: false },
    { key: 'personal', name: '事假', rate: 1, verified: false },
    { key: 'family', name: '家庭照顧假', rate: 1, verified: false },
    { key: 'marriage', name: '婚假', rate: 0, verified: false },
    { key: 'funeral', name: '喪假', rate: 0, verified: false }
  ];
  const LEAVE_LIMIT_DAYS = { sick: 30, personal: 14, family: 7, marriage: 8 };

  /* --- 特休：每年 1/1 發放 min(180+8×(年−2026), 240)；未休完遞延一年，再未休完折現於隔年 1 月薪資；先扣遞延 --- */
  const grant = y => Math.min(180 + 8 * (y - 2026), 240);
  function ledger(start, entries, until) {
    // start: {date, current, deferred, comp}（指該日結束時的餘額）
    let cur = +start.current, def = +start.deferred, comp = +start.comp, year = +start.date.slice(0, 4);
    const cashouts = {}, rolls = [];
    const roll = toYear => {
      while (year < toYear) {
        year++;
        if (def > 0) cashouts[`${year}-01`] = +(def.toFixed(2));
        rolls.push({ year, deferredCashed: Math.max(def, 0), newDeferred: cur, grant: grant(year) });
        def = cur; cur = grant(year);
      }
    };
    entries.filter(e => e.date > start.date && e.date <= until).sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => {
      roll(+e.date.slice(0, 4));
      if (e.type === 'annual') { const fromDef = Math.min(Math.max(def, 0), e.hours); def -= fromDef; cur -= e.hours - fromDef; }
      if (e.type === 'comp') comp -= e.hours;
      if (e.type === 'compAdd') comp += e.hours;
    });
    roll(+until.slice(0, 4));
    const r = x => Math.round(x * 100) / 100;
    return { current: r(cur), deferred: r(def), comp: r(comp), cashouts, rolls };
  }

  /* --- 薪資（已驗證：2026/03、2026/07 兩張薪資單 + 2026/07 出勤表） --- */
  const PAY_FIELDS = {
    fixed: [['base', '本薪'], ['mgr', '主管加給'], ['env', '環境津貼'], ['tech', '技術津貼'], ['shift', '輪班津貼'], ['attend', '出勤津貼']],
    variable: [['merit', '考績獎金'], ['meal2', '伙食(2)', 'A'], ['meal1', '伙食(1)', 'B'], ['otherA', '其他應稅加項', 'A'], ['otherB', '其他免稅加項', 'B']],
    deduct: [['labor', '勞保費'], ['health', '健保費'], ['welfare', '福利金'], ['tax', '所得稅'], ['food2', '餐費(2)'], ['food1', '餐費(1)'], ['court', '法院扣款'], ['union', '福委代扣'], ['dorm', '宿舍費'], ['group', '團保費'], ['otherD', '其他代扣']]
  };
  function pay(p) {
    // p: {fixed, variable, deduct, ot:[{date,kind,hours}], h1:[{date,hours}], leave:[{date,type,hours}], rates:{leave:{key:rate}, workday}, cashoutHours}
    const v = (o, k) => +((o || {})[k] || 0);
    const A1 = ['base', 'mgr', 'env', 'tech', 'shift', 'attend'].reduce((s, k) => s + v(p.fixed, k), 0) + v(p.variable, 'merit');
    const B0 = v(p.variable, 'meal1');
    const A2 = round((A1 + B0) / 240 * 2 * 50);
    const otRate = (A1 + A2 + B0) / 240, leaveRate = (A1 + B0) / 240;
    const mult = k => k === 'rest' ? 2 : +((p.rates || {}).workday ?? 1);
    const ot = (p.ot || []).map(e => ({ ...e, mult: mult(e.kind), amount: ceil(e.hours * otRate * mult(e.kind)) }));
    const h1 = (p.h1 || []).filter(e => e.hours > 0).map(e => ({ ...e, amount: ceil(e.hours * otRate) }));
    const lrate = k => { const r = ((p.rates || {}).leave || {})[k]; return r ?? (LEAVE_TYPES.find(t => t.key === k) || {}).rate ?? 0; };
    const leave = (p.leave || []).map(e => ({ ...e, rate: lrate(e.type), amount: round(e.hours * leaveRate * lrate(e.type)) }));
    const cashout = p.cashoutHours ? round(p.cashoutHours * leaveRate) : 0;
    const otSum = ot.reduce((s, e) => s + e.amount, 0), h1Sum = h1.reduce((s, e) => s + e.amount, 0);
    const C = leave.reduce((s, e) => s + e.amount, 0);
    const D = PAY_FIELDS.deduct.reduce((s, [k]) => s + v(p.deduct, k), 0);
    const A = A1 + A2 + v(p.variable, 'meal2') + v(p.variable, 'otherA') + cashout;
    const B = B0 + otSum + h1Sum + v(p.variable, 'otherB');
    const otHours = ot.reduce((s, e) => s + e.hours, 0);
    return { A1, A2, B0, otRate, leaveRate, ot, h1, leave, cashout, otSum, h1Sum, A, B, C, D, gross: A + B, net: A + B - C - D, otHours, over46: otHours > 46 };
  }

  return { pad, ymd, toDate, fromDate, addDays, diffDays, dow, dim, ymOf, ymAdd, monthDates, ANCHOR, TEAMS, SHIFT_HOURS, baseWork,
    holidaysOn, holidayList, isRedDay, isBankOff, payday, swapOn, finalWork, swapLabel, validateSwap, orderSwap,
    LEAVE_TYPES, LEAVE_LIMIT_DAYS, grant, ledger, PAY_FIELDS, pay, YEARS };
})();


/* ===== 驗收測資 T1–T6（規格第 9 節） ===== */
function runSpecTests(C) {
  const out = [];
  const t = (group, name, got, want) => out.push({ group, name, got: JSON.stringify(got), want: JSON.stringify(want), ok: JSON.stringify(got) === JSON.stringify(want) });
  const days = (team, ym) => C.monthDates(ym).filter(d => C.baseWork(team, d)).map(d => +d.slice(8));
  // T1 班表
  t('T1 班表', '2026/10 E3', days('E3', '2026-10'), [3,4,5,6,9,10,11,12,15,16,17,18,21,22,23,24,27,28,29,30]);
  t('T1 班表', '2026/10 E1', days('E1', '2026-10'), [1,2,5,6,7,8,11,12,13,14,17,18,19,20,23,24,25,26,29,30,31]);
  t('T1 班表', '2026/10 E2', days('E2', '2026-10'), [1,2,3,4,7,8,9,10,13,14,15,16,19,20,21,22,25,26,27,28,31]);
  t('T1 班表', '2026/07 E3', days('E3', '2026-07'), [1,2,5,6,7,8,11,12,13,14,17,18,19,20,23,24,25,26,29,30,31]);
  t('T1 班表', '2027/01/01 上班隊別', C.TEAMS.filter(x => C.baseWork(x, '2027-01-01')), ['E2', 'E3']);
  t('T1 班表', '2036/12/31 上班隊別', C.TEAMS.filter(x => C.baseWork(x, '2036-12-31')), ['E1', 'E2']);

/* ---------- 小算盤 ---------- */
const Calcu = { ex: '', res: '0', done: false };
function calcEval(ex) {
  const toks = ex.match(/\d*\.?\d+|[+\-×÷%]/g) || [];
  const out = [], ops = [], prec = { '+': 1, '-': 1, '×': 2, '÷': 2 };
  let prevNum = false;
  for (const t of toks) {
    if (/\d/.test(t)) { out.push(parseFloat(t)); prevNum = true; }
    else if (t === '%') { if (out.length) out.push(out.pop() / 100); }
    else { if (!prevNum && t === '-') { out.push(0); } while (ops.length && prec[ops[ops.length - 1]] >= prec[t]) out.push(ops.pop()); ops.push(t); prevNum = false; }
  }
  while (ops.length) out.push(ops.pop());
  const st = [];
  for (const t of out) { if (typeof t === 'number') st.push(t); else { const b = st.pop(), a = st.pop(); if (a == null || b == null) return NaN; st.push(t === '+' ? a + b : t === '-' ? a - b : t === '×' ? a * b : a / b); } }
  return st.length === 1 ? st[0] : NaN;
}
const fmtCalc = v => !isFinite(v) ? '錯誤' : (Math.abs(v) >= 1e12 ? v.toExponential(6) : (+v.toPrecision(12)).toLocaleString('en-US', { maximumFractionDigits: 10 }));
function calcKey(k) {
  const last = Calcu.ex.slice(-1);
  if (k === 'C') { Calcu.ex = ''; Calcu.res = '0'; Calcu.done = false; }
  else if (k === '⌫') { Calcu.ex = Calcu.ex.slice(0, -1); Calcu.done = false; }
  else if (k === '=') { const v = calcEval(Calcu.ex); Calcu.res = fmtCalc(v); if (isFinite(v)) { Calcu.ex = String(+v.toPrecision(12)); Calcu.done = true; } }
  else if ('+-×÷'.includes(k)) { Calcu.done = false; if (/[+\-×÷]$/.test(Calcu.ex)) Calcu.ex = Calcu.ex.slice(0, -1) + k; else if (Calcu.ex || k === '-') Calcu.ex += k; }
  else if (k === '%') { if (/[\d.]$/.test(Calcu.ex)) Calcu.ex += '%'; }
  else if (k === '.') { if (Calcu.done) { Calcu.ex = ''; Calcu.done = false; } const seg = Calcu.ex.split(/[+\-×÷]/).pop(); if (!seg.includes('.')) Calcu.ex += (seg === '' ? '0.' : '.'); }
  else { if (Calcu.done) { Calcu.ex = ''; Calcu.done = false; } if (last === '%') Calcu.ex += '×'; Calcu.ex += k; }
  if (k !== '=' && k !== 'C') { const v = calcEval(Calcu.ex); if (isFinite(v) && Calcu.ex) Calcu.res = fmtCalc(v); }
  renderSheet();
}
function renderCalcSheet() {
  const keys = [['C', 'fn'], ['⌫', 'fn'], ['%', 'fn'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'], ['4'], ['5'], ['6'], ['-', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['0', 'zero'], ['.'], ['=', 'eq']];
  return `<div class="grab"></div><div class="sh-head"><h2 style="margin:0">小算盤</h2><button class="iconbtn" data-act="close" aria-label="關閉">✕</button></div>
  <div class="calc-disp" style="margin-top:10px"><div class="ex">${esc(Calcu.ex.replace(/-/g, '−')) || '&nbsp;'}</div><div class="rs" aria-live="polite">${esc(Calcu.res)}</div></div>
  <div class="keys">${keys.map(([k, c]) => `<button class="${c || ''}" data-key="${k}">${k === '-' ? '−' : k}</button>`).join('')}</div>
  <div class="btns" style="margin-top:10px"><button class="btn ghost" data-act="copycalc">複製結果</button></div>`;
}

/* ---------- 假勤 ---------- */

    const yr = ent.filter(e => e.type === t.key && e.date.startsWith(y + '-')).reduce((s, e) => s + +e.hours, 0);
    const mo = ent.filter(e => e.type === t.key && e.date.startsWith(curYm)).reduce((s, e) => s + +e.hours, 0);
    const lim = C.LEAVE_LIMIT_DAYS[t.key];
    const over = lim && yr / 10 > lim;
    return `<div class="row"><div class="l">${lvDot(t.key)}<b>${t.name}</b> <span class="chip ${t.verified ? 'ok' : 'warn'}">${leaveRates()[t.key] === 0 ? '不扣薪' : leaveRates()[t.key] === 1 ? '全扣' : '扣 ' + leaveRates()[t.key] * 100 + '%'}${t.verified ? '' : '・未驗證'}</span>

    .filter(([d, x]) => !q || (x.note || '').includes(q) || (x.reminders || []).some(r => r.title.includes(q)))
    .sort((a, b) => a[0] < b[0] ? 1 : -1);
  return `<label class="f"><span class="small">搜尋日誌</span><input type="text" id="q" value="${esc(q)}" placeholder="輸入關鍵字"></label>
  <div class="btns" style="margin-top:10px"><button class="btn main" data-day="${today}">寫今天的日誌</button></div>
  <div class="stack" style="margin-top:12px">${items.map(([d, x]) => `<button class="card" style="text-align:left" data-day="${d}">
    <div class="small muted" style="font-weight:700">${fmtFull(d)} · ${isWork(d) ? '上班' : '休假'}</div>
    ${x.note ? `<div style="margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.note.length > 120 ? x.note.slice(0, 120) + '…' : x.note)}</div>` : ''}
    ${(x.reminders || []).map(r => `<div class="small" style="margin-top:4px">⏰ <span class="num">${esc(r.time)}</span> ${esc(r.title)}</div>`).join('')}
    ${(x.photos || []).length ? `<div class="photos">${x.photos.map(id => `<div class="ph"><img src="${photoCache[id] || ''}" alt="日誌照片"></div>`).join('')}</div>` : ''}
  </button>`).join('') || '<div class="empty">還沒有日誌。點班表上任何一天，就能寫字、放照片、設提醒。</div>'}</div>`;
}

/* ---------- 抽屜 ---------- */
function renderSheet() {
  const sh = $('#sheet'), sc = $('#scrim');
  if (!UI.sheet) { sh.hidden = true; sc.hidden = true; document.body.style.overflow = ''; return; }
  const keep = sh.hidden ? 0 : sh.scrollTop;
  $('#sheetIn').innerHTML = UI.sheet.kind === 'day' ? renderDaySheet() : renderCalcSheet();
  sh.hidden = false; sc.hidden = false; document.body.style.overflow = 'hidden';
  sh.scrollTop = keep;
}
function closeSheet() { UI.sheet = null; renderSheet(); render(); }

/* ---------- 主畫面 ---------- */
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme);
}
function render() {
  renderTabs(); renderTop();
  const v = { calendar: renderCalendar, pay: renderPay, leave: renderLeave, diary: renderDiary, more: renderMore }[UI.tab]();
  $('#view').innerHTML = v;
}

/* ---------- 事件 ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-view]'); if (!t) { if (e.target.id === 'scrim') closeSheet(); return; }
  const ds = t.dataset;
  if (ds.tab) return go(ds.tab);
  if (ds.nav != null) { UI.ym = ds.nav === '0' ? clampYm(today.slice(0, 7)) : clampYm(C.ymAdd(UI.ym, +ds.nav)); return render(); }
  if (ds.pnav != null) { UI.payYm = ds.pnav === '0' ? clampYm(today.slice(0, 7)) : clampYm(C.ymAdd(UI.payYm, +ds.pnav)); return render(); }
  if (ds.mode) { S.mode = ds.mode; save(); return render(); }
  if (ds.go) { if (ds.payym) UI.payYm = ds.payym; return go(ds.go); }
  if (ds.day && !UI.sheet) return openDay(ds.day);
  if (ds.ly) { UI.leaveYear += +ds.ly; return render(); }
  if (ds.hy) { UI.hlYear = Math.max(2026, Math.min(2036, UI.hlYear + +ds.hy)); return render(); }
  if (ds.themeSet) { S.theme = ds.themeSet; applyTheme(); save(); return render(); }
  if (ds.hreset) { delete S.holidayEdits[ds.hreset]; save(); return render(); }
  if (ds.hdel) { const [d, n] = ds.hdel.split('|'); S.holidayEdits[d] = C.holidaysOn(d, S.holidayEdits).filter(h => h.name !== n); save(); return render(); }
  if (ds.key) return calcKey(ds.key);
  if (ds.view) { const v = $('#viewer'); v.innerHTML = `<img src="${photoCache[ds.view]}" alt="日誌照片">`; v.hidden = false; return; }
  if (ds.swk) { UI.sheet.swapKind = ds.swk; return renderSheet(); }
  if (ds.pick) { UI.sheet.pick = ds.pick; return renderSheet(); }
  const act = ds.act; if (!act) return;
  const s = UI.sheet, d = s && s.d;
  switch (act) {
    case 'close': return closeSheet();
    case 'swapopen': s.swapOpen = true; return renderSheet();
    case 'swapcancel': s.swapOpen = false; s.pick = null; return renderSheet();
    case 'swapok': {
      const err = C.validateSwap(S.swaps, d, s.pick); if (err) return toast(err);
      S.swaps.push({ id: uid(), kind: s.swapKind, peer: s.swapKind === 'peer' ? s.peer.trim() : '', ...C.orderSwap(d, s.pick) });
      s.swapOpen = false; s.pick = null; save(); toast('已調班'); return renderSheet();
    }
    case 'unswap': S.swaps = S.swaps.filter(x => x.id !== ds.id); save(); toast('已取消調班，兩天都還原了'); return renderSheet();
    case 'addot': {
      const h = parseFloat($('#otH').value); if (!(h > 0)) return toast('請填加班時數');
      (dayW(d).ot = day(d).ot || []).push({ id: uid(), kind: isWork(d) ? 'workday' : 'rest', hours: h }); save(); return renderSheet();
    }
    case 'delot': dayW(d).ot = day(d).ot.filter(x => x.id !== ds.id); tidyDay(d); save(); return renderSheet();
    case 'addlv': {
      const h = parseFloat($('#lvH').value); if (!(h > 0)) return toast('請填請假時數');
      (dayW(d).leave = day(d).leave || []).push({ id: uid(), type: $('#lvT').value, hours: h }); save(); return renderSheet();
    }
    case 'dellv': dayW(d).leave = day(d).leave.filter(x => x.id !== ds.id); tidyDay(d); save(); return renderSheet();
    case 'delph': { dayW(d).photos = day(d).photos.filter(x => x !== ds.id); Store.del('photo:' + ds.id); delete photoCache[ds.id]; tidyDay(d); save(); return renderSheet(); }
    case 'addrem': {
      const title = $('#remTitle').value.trim(), time = $('#remT').value; if (!title || !time) return toast('請填時間和提醒內容');
      (dayW(d).reminders = day(d).reminders || []).push({ id: uid(), time, title }); save(); return renderSheet();
    }
    case 'delrem': dayW(d).reminders = day(d).reminders.filter(x => x.id !== ds.id); tidyDay(d); save(); return renderSheet();
    case 'ics': {
      const r = (day(d).reminders || []).find(x => x.id === ds.id); if (!r) return;
      const ics = makeIcs(d, r); await tryDownload(`提醒-${d}.ics`, ics, 'text/calendar'); return;
    }
    case 'copycalc': return copyText(Calcu.res.replace(/,/g, ''), '已複製結果');
    case 'hadd': {
      const hd = $('#hD').value, hn = $('#hN').value.trim(), hk = $('#hK').value;
      if (!hd || !hn) return toast('請填日期和名稱');
      S.holidayEdits[hd] = [...C.holidaysOn(hd, S.holidayEdits), { name: hn, kind: hk }]; UI.hlYear = +hd.slice(0, 4); save(); toast('已新增'); return render();
    }
    case 'export': { const txt = await exportText(); await tryDownload(`輪班手帳備份-${today}.json`, txt, 'application/json'); return; }
    case 'copyexport': return copyText(await exportText(), '已複製備份內容');
    case 'importtext': return importData($('#impText').value);
    case 'runtests': testResults = runSpecTests(C); return render();
  }
});
$('#viewer').addEventListener('click', () => { $('#viewer').hidden = true; });
$('#scrim').addEventListener('click', closeSheet);
$('#fab').addEventListener('click', () => { UI.sheet = { kind: 'calc' }; renderSheet(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && UI.sheet) closeSheet();
  if (UI.sheet && UI.sheet.kind === 'calc') { const m = { '*': '×', '/': '÷', Enter: '=', Backspace: '⌫', Escape: null }; const k = m[e.key] !== undefined ? m[e.key] : e.key; if (k && /^[0-9.+\-×÷%=⌫]$/.test(k)) { e.preventDefault(); calcKey(k); } }
});
document.addEventListener('input', e => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'peerName') { UI.sheet.peer = t.value; const b = document.querySelector('[data-act="swapok"]'); if (b) b.disabled = !UI.sheet.pick || !!C.validateSwap(S.swaps, UI.sheet.d, UI.sheet.pick) || !t.value.trim(); return; }
  if (t.id === 'note') { const d = UI.sheet.d; dayW(d).note = t.value; tidyDay(d); save(); return; }
  if (t.id === 'q') { UI.q = t.value; const pos = t.selectionStart; render(); const n = $('#q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } return; }
});
document.addEventListener('change', async e => {
  const t = e.target, ds = t.dataset;
  if (ds.pf) { const [g, k] = ds.pf.split('.'); const rec = ensurePayMonth(ds.ym); rec[g][k] = +t.value || 0; save(); return render(); }
  if (t.id === 'actual') { const rec = ensurePayMonth(t.dataset.ym); rec.actual = t.value === '' ? null : +t.value; save(); return render(); }
  if (t.id === 'typh') { const d = UI.sheet.d; dayW(d).typhoon = t.checked; tidyDay(d); save(); return renderSheet(); }
  if (ds.st) { S.start[ds.st] = ds.st === 'date' ? t.value : +t.value || 0; save(); return; }
  if (ds.rate) { const v = parseFloat(t.value); if (v >= 0 && v <= 1) S.rates.leave[ds.rate] = v; save(); return; }
  if ('wrate' in ds) { const v = parseFloat(t.value); if (v > 0) S.rates.workday = v; save(); return; }
  if (t.id === 'phIn') {
    const d = UI.sheet.d; const cur = day(d).photos || []; const files = [...t.files].slice(0, 5 - cur.length);
    if (t.files.length > files.length) toast('每天最多 5 張照片');
    for (const f of files) { try { const url = await compress(f); const id = uid(); photoCache[id] = url; await Store.set('photo:' + id, url); (dayW(d).photos = day(d).photos || []).push(id); } catch (err) { toast('有一張照片讀不出來，換一張試試'); } }
    save(); return renderSheet();
  }
  if (t.id === 'impFile' && t.files[0]) { const txt = await t.files[0].text(); return importData(txt); }
});

/* ---------- 照片、行事曆、備份 ---------- */
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      let q = 0.82, out = cv.toDataURL('image/jpeg', q);
      while (out.length > 420000 && q > 0.45) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
      res(out);
    };
    img.onerror = rej; img.src = url;
  });
}
function makeIcs(d, r) {
  const [hh, mm] = r.time.split(':').map(Number);
  const start = new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8), hh - 8, mm));
  const end = new Date(start.getTime() + 30 * 60000);
  const f = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const txt = s => s.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//E3 Shift Book//TW', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT', `UID:${r.id}@e3-shift-book`, `DTSTAMP:${f(new Date())}`,
    `DTSTART:${f(start)}`, `DTEND:${f(end)}`, `SUMMARY:${txt(r.title)}`, 'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${txt(r.title)}`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
async function exportText() {
  const ids = Object.values(S.days).flatMap(x => x.photos || []);
  const photos = {};
  for (const id of ids) photos[id] = photoCache[id] || await Store.get('photo:' + id) || null;
  return JSON.stringify({ app: 'e3-shift-book', exportedAt: new Date().toISOString(), state: S, photos });
}
async function importData(txt) {
  try {
    const o = JSON.parse(txt);
    const st = o.state || o; if (!st || st.v !== 1 || !st.days || !st.start) throw new Error('格式');
    S = Object.assign(SEED(), st, { rates: Object.assign({ workday: 1, leave: {} }, st.rates || {}) });
    for (const [id, url] of Object.entries(o.photos || {})) if (url) { photoCache[id] = url; await Store.set('photo:' + id, url); }
    await Store.set('state', JSON.parse(JSON.stringify(S)));
    importMsg = '✓ 已還原備份'; applyTheme(); render();
  } catch (err) { importMsg = '這不是輪班手帳的備份內容，請確認貼上的是完整的匯出內容。'; render(); }
}

/* ---------- 啟動 ---------- */
(async () => {
  const h = (location.hash || '').slice(1); if (TABS.some(([k]) => k === h)) UI.tab = h;
  applyTheme(); render();
  await Store.open();
  try {
    const saved = await Store.get('state');
    if (saved && saved.v === 1) { S = Object.assign(SEED(), saved); S.rates = Object.assign({ workday: 1, leave: {} }, saved.rates || {}); }
    else await Store.set('state', JSON.parse(JSON.stringify(S)));
    const ks = (await Store.keys()) || [];
    for (const k of ks) if (String(k).startsWith('photo:')) photoCache[k.slice(6)] = await Store.get(k);
  } catch (e) { }
  applyTheme(); render();
})();
})();
